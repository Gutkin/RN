plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.gutkin.frame'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig {
  applicationId 'com.gutkin.frame'
  minSdk 29
  targetSdk 35
  versionCode 3
  versionName '0.2.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
 testBuildType 'release'
 buildFeatures { compose true; buildConfig true }
 composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'androidx.media3:media3-effect:1.5.1'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
